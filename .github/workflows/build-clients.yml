name: Build Multiplatform Clients

on:
  push:
    branches: [ canary, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libmpv-dev mpv libpulse-dev \
            libsecret-1-dev libjsoncpp-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux Release
        run: flutter build linux --release --dart-define-from-file=tool/dart_defines/custom.json

      - name: Package Linux Artifact
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../Fluxer-Linux-x86_64.tar.gz .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fluxer-Linux-x86_64
          path: Fluxer-Linux-x86_64.tar.gz

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows Release
        env:
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
        run: flutter build windows --release --dart-define-from-file=tool/dart_defines/custom.json

      - name: Package Windows Artifact
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "Fluxer-Windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fluxer-Windows-x64
          path: Fluxer-Windows-x64.zip

  build-macos:
    name: Build macOS Desktop
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Configure Ad-Hoc Signing
        run: |
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development";/CODE_SIGN_IDENTITY = "-";/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "-";/g' macos/Runner.xcodeproj/project.pbxproj

      - name: Build macOS Release
        run: flutter build macos --release --dart-define-from-file=tool/dart_defines/custom.json

      - name: Package macOS Artifact
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../Fluxer-macOS.zip .

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fluxer-macOS
          path: Fluxer-macOS.zip

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Android Release APK
        run: |
          flutter build apk --release \
            --flavor stableUnifiedpush \
            --dart-define-from-file=tool/dart_defines/custom.json \
            --dart-define=PUSH_PROVIDER=unifiedpush
          cp build/app/outputs/flutter-apk/app-stable-unifiedpush-release.apk Fluxer-Android.apk || cp build/app/outputs/flutter-apk/*.apk Fluxer-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fluxer-Android
          path: Fluxer-Android.apk

  publish-release:
    name: Publish Release
    needs: [build-linux, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/canary' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Fluxer Client (Latest Build)"
          body: |
            Автоматическая сборка клиента Fluxer, настроенная на сервер **chat.wayg.su**.
            
            ### Доступные файлы для скачивания:
            * **Windows:** `Fluxer-Windows-x64.zip`
            * **Linux:** `Fluxer-Linux-x86_64.tar.gz`
            * **macOS:** `Fluxer-macOS.zip`
            * **Android:** `Fluxer-Android.apk`
          draft: false
          prerelease: false
          files: |
            release-files/Fluxer-Linux-x86_64.tar.gz
            release-files/Fluxer-Windows-x64.zip
            release-files/Fluxer-macOS.zip
            release-files/Fluxer-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
